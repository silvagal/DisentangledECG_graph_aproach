experiment_name: Part2_Exp2_1_MousaviSeq2Seq
seed: 42
device: cuda

dataset_params:
  path: Data
  train_split: Train
  test_split: Test
  beat_size_before: 100
  beat_size_after: 180
  undersampling_ratio: 0.1
  undersampling_method: stride
  undersample_test: true
  paradigm: inter
  val_from_train_ratio: 0.2
  preprocess_workers: 0

data_loader_params:
  sequence_length: 10

training:
  batch_size: 64
  learning_rate: 0.0005
  weight_decay: 0.01
  warmup_ratio: 0.1
  grad_clip_max_norm: 1.0
  epochs: 150

model_params:
  model_name: MousaviSeq2Seq
  model_type: seq2seq_cnn
  cnn:
    latent_dim: 128
  encoder:
    hidden_size: 128
    num_layers: 1
  decoder:
    hidden_size: 128
    num_layers: 1
    teacher_forcing: True
  classifier:
    num_classes: 3