experiment_name: Part2_Exp2_1_DANet
seed: 42
device: cuda

dataset_params:
  path: Data
  train_split: Train
  test_split: Test
  beat_size_before: 100
  beat_size_after: 180
  undersampling_ratio: 0.1
  undersampling_method: stride
  undersample_test: true
  paradigm: inter
  val_from_train_ratio: 0.2
  preprocess_workers: 0

training:
  batch_size: 128
  learning_rate: 0.0004
  epochs: 150

model_params:
  model_name: DANet
  model_type: cnn
  input_channels: 1
  num_classes: 3